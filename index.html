      (function () {
        try {
          var t = localStorage.getItem('roots-theme');
          // Dark forest green is the default; only a persisted choice picks light.
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#041107' : '#e4f1e6');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();

      <h1>Roots — Free Encrypted Family Tree Maker (No Account)</h1>
      <p>Roots is a free, privacy-first family tree maker. Add your relatives and watch the tree grow automatically, then share it with family through a single link. Everything runs in your browser — no accounts, no servers, no tracking — and your tree is encrypted with AES-256-GCM and stored inside the link itself, so only the people you share it with can open it. You can export your tree as a PNG image, an SVG, or a JSON file, and the app works in English, Arabic (with full right-to-left support), and Turkish.</p>

      <h2>What you can build</h2>
      <p>Roots lays out interactive, multi-generation trees — couples, parents, children, and siblings — and arranges them for you as you add people. It works as a family tree builder and visualizer: add relatives and it generates the chart automatically. Each person can carry photos, dates, and custom details, and you can read the tree as a pedigree, ancestor, or descendant view. Because the whole tree lives in one encrypted link, sharing it is as simple as sending a URL. Roots is free and open source, with no sign-up required.</p>

      <h2>Frequently asked questions</h2>
      <p><strong>How do I make a family tree online for free?</strong> Open Roots, set a passphrase, and add family members — it is a free family tree maker that runs entirely in your browser, with no account or download, and you share your tree by sending its link.</p>
      <p><strong>Can I make a family tree without an account?</strong> Yes — Roots needs no sign-up and no email. Your tree lives in the URL, so there is nothing to register and nothing stored on a server.</p>
      <p><strong>Is there a private, encrypted family tree maker?</strong> Yes — Roots encrypts your family tree with AES-256-GCM and stores it inside the link, with no servers, no databases, and no tracking.</p>
      <p><strong>Can I export my family tree as an image or file?</strong> Yes — export your tree as a PNG image, an SVG vector, or a JSON file, and re-import it from JSON.</p>
      <p><strong>Does it work in Arabic and Turkish?</strong> Yes — Roots is available in English, Arabic (العربية) with full right-to-left support, and Turkish (Türkçe).</p>

      <section lang="ar" dir="rtl">
        <h2>أداة مجانية لرسم شجرة العائلة — Roots</h2>
        <p>Roots أداة مجانية وتحترم خصوصيتك لرسم شجرة العائلة. أضف أفراد عائلتك وشاهد الشجرة تكبر تلقائياً، ثم شاركها مع عائلتك عبر رابط واحد. كل شيء يعمل داخل متصفحك بلا حسابات ولا خوادم ولا تتبّع، وبياناتك مشفّرة بخوارزمية AES-256-GCM ومخزّنة داخل الرابط نفسه، فلا يفتحها إلا من تشاركه الرابط. يمكنك تصدير الشجرة كصورة PNG أو ملف SVG أو JSON، والتطبيق متوفّر بالعربية مع دعم كامل للكتابة من اليمين إلى اليسار.</p>
      </section>

      <section lang="tr">
        <h2>Ücretsiz Soy Ağacı Oluşturucu — Roots</h2>
        <p>Roots, ücretsiz ve gizliliğe önem veren bir soy ağacı oluşturucudur. Aile üyelerinizi ekleyin, ağacın otomatik olarak büyümesini izleyin ve tek bir bağlantıyla ailenizle paylaşın. Her şey tarayıcınızda çalışır; hesap, sunucu veya takip yoktur. Verileriniz AES-256-GCM ile şifrelenir ve bağlantının içinde saklanır, böylece ağacı yalnızca bağlantıyı paylaştığınız kişiler açabilir. Ağacınızı PNG, SVG veya JSON olarak dışa aktarabilir; uygulamayı İngilizce, Arapça ve Türkçe dillerinde kullanabilirsiniz.</p>
